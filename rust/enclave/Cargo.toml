[package]
name = "vault-enclave"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
# CVE-LSES-002: Use native OS entropy backend. The "js" feature is for
# WASM/browser only and must never be used for native builds.
getrandom = { version = "0.2" }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
# CVE-LSES-008: Constant-time comparison to prevent timing side-channels.
subtle = { version = "2.6", default-features = false }
# CVE-LSES-010: Proper key derivation with domain separation.
hkdf = { version = "0.12", default-features = false }
# CVE-LSES-019: Zeroize key material on drop.
zeroize = { version = "1.8", default-features = false }
